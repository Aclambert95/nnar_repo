<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | No Nonsense Animal Rescue</title>
    <link rel="icon" type="image/png" href="assets/images/nnar_emblem_round.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/form.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url("assets/images/form_bkgrd.png");
            background-size: cover;
            background-position: center;
        }

        .thank-you-box {
            width: min(90%, 600px);
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid #2d3a2f;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .thank-you-box h1 {
            color: #2d3a2f;
            margin-bottom: 1rem;
        }

        .thank-you-box p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .thank-you-box a {
            display: inline-block;
            background: #2d3a2f;
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
        }

        .thank-you-box a:hover {
            background: #1f2a22;
        }
    </style>
</head>
<body>
    <div class="thank-you-box">
        <h1>Thank You!</h1>
        <p>Your form has been submitted successfully.<br>
        We will review it and be in touch soon.</p>
        <a href="index.html">Return to Home</a>
    </div>
</body>
</html>
