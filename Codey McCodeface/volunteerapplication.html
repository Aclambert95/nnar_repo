<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Nonsense Animal Rescue</title>
    <link rel="icon" type="image/png" href="assets/images/nnar_logo_icon.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/form.css">
    <script src="assets/navManager.js"></script>
</head>

<body class="main-body">

    <header>
        <h1 class="header">No Nonsense Animal Rescue</h1>
    </header>

    <special-nav></special-nav>

    <form class="adoption-form" id="volunteer-form">
        <h2>NNAR Volunteer Application</h2>

        <fieldset class="set1">
            <h2>Volunteer Test Form</h2>

            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="Full Name" required><br>

            <label for="email">Email</label>
            <input type="email" id="email" name="Email" required><br>

            <label for="phone">Phone</label>
            <input type="text" id="phone" name="Phone" inputmode="numeric" required><br>

            <label for="availability">Availability</label>
            <input type="text" id="availability" name="Availability" required><br>

            <label for="notes">Notes</label>
            <textarea id="notes" name="Notes" rows="4"></textarea><br>

            <div class="submit-row">
                <button type="submit" class="submit-btn">Submit</button>
            </div>
        </fieldset>
    </form>

    <footer>
        <p>&copy; No Nonsense Animal Rescue</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        emailjs.init({
            publicKey: "JCDGWkoTNJTEu0EKA"
        });

        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("volunteer-form");

            if (!form) return;

            form.addEventListener("submit", function (event) {
                event.preventDefault();

                const formData = new FormData(form);
                const values = Object.fromEntries(formData.entries());

                const escapeHtml = (value) =>
                    String(value)
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;");

                const rows = Object.entries(values)
                    .map(([key, value]) => `
                        <tr>
                            <td style="padding:6px;border:1px solid #d9d9d9;max-width:220px;white-space:normal;word-break:break-word;">${escapeHtml(key)}</td>
                            <td style="padding:6px;border:1px solid #d9d9d9;">${escapeHtml(value)}</td>
                        </tr>
                    `)
                    .join("");

                const templateParams = {
                    message: `
                        <h2>Volunteer Test Submission</h2>
                        <table style="border-collapse:collapse;width:100%;font-family:Arial,sans-serif;">
                            <tbody>${rows}</tbody>
                        </table>
                    `
                };

                emailjs.send("service_ehbvz1o", "template_nm74ryb", templateParams)
                    .then(function () {
                        form.reset();
                        window.location.href = "thank-you.html";
                    })
                    .catch(function (error) {
                        console.error("EmailJS error:", error);
                        alert("There was a problem sending your form. Please try again.");
                    });
            });
        });
    </script>

    <script src="assets/javascript.js"></script>
</body>
</html>
